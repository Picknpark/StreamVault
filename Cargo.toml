[workspace]
resolver = "2"
members = [
    "crates/streamvault-core",
    "src-tauri",
]

[workspace.package]
version = "1.1.0"
edition = "2021"
authors = ["StreamVault Engineering"]
license = "MIT"

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
strip = "symbols"
panic = "unwind"
debug = false

# Win32/COM signature wrapper crates consist solely of inline vtable/FFI thunks;
# opt-level = 0 keeps peak rustc memory low while retaining full optimization on app & runtime crates.
[profile.release.package.windows]
opt-level = "z"

[profile.release.package.webview2-com]
opt-level = "z"
