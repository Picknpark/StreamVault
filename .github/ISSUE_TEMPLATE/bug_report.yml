name: Bug Report
description: Report a playback, browser, streaming cache, or download issue in StreamVault
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve **StreamVault**! Please sanitize any private credentials or personal tokens before pasting URLs or log snippets.

  - type: input
    id: version
    attributes:
      label: StreamVault Version
      placeholder: "v1.0.0"
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows Version & GPU
      description: "Example: Windows 11 24H2 (x64), NVIDIA RTX 3060 / Intel Iris Xe"
      placeholder: "Windows 11 23H2 (x64)"
    validations:
      required: true

  - type: dropdown
    id: subsystem
    attributes:
      label: Affected Area
      options:
        - Built-in Player (libmpv / D3D11 / Fullscreen / Subtitles)
        - Multi-Tab Browser (WebView2 / Bookmarks / History)
        - Progressive HTTP Range Streaming Cache
        - Permanent Download Manager
        - External Media Player Launch
        - Portable Database / Settings
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Open Browser tab and navigate to ...
        2. Right-click media link and choose 'Play in StreamVault'
        3. Press 'F' to toggle fullscreen...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs. Actual Behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Diagnostic Output (Optional)
      description: "Paste relevant lines from Settings → Diagnostics or data\\logs\\streamvault.log"
      render: json
