name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  core-tests-and-ui-lint:
    name: Core Integration Suite & UI Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Validate Vanilla JS ES module syntax
        run: |
          for f in ui/js/*.js; do
            node --check "$f"
          done

      - name: Run streamvault-core integration test suite
        run: cargo test -p streamvault-core -- --nocapture

  windows-build:
    name: Windows x64 GUI Build Check (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust stable (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build StreamVault.exe (Release)
        run: cargo build --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc --release
