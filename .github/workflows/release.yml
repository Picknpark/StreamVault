name: Release Portable Windows Package

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Package StreamVault Portable (win64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine release version
        id: meta
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $ver = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $ver = "${{ inputs.version }}"
          }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Setup Rust stable (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run streamvault-core integration tests
        run: cargo test -p streamvault-core

      - name: Compile StreamVault.exe (Release)
        run: cargo build --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc --release

      - name: Compile 2 KB Vulkan VM fallback stub DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build-deps | Out-Null
          clang --target=x86_64-pc-windows-msvc -O2 -nostdlib -Wl,/DLL -Wl,/NOENTRY `
            runtime-src/vulkan_fallback_stub.c -fuse-ld=lld-link `
            -o build-deps/vulkan-1.dll

      - name: Fetch latest LGPL 64-bit libmpv-2.dll (zhongfly/mpv-winbuild)
        shell: pwsh
        run: |
          $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/zhongfly/mpv-winbuild/releases/latest"
          $asset = $rel.assets | Where-Object { $_.name -match "^mpv-dev-lgpl-x86_64-\d{8}-git-[a-f0-9]+\.7z$" } | Select-Object -First 1
          if (-not $asset) {
            $asset = $rel.assets | Where-Object { $_.name -like "mpv-dev-lgpl-x86_64*.7z" } | Select-Object -First 1
          }
          if (-not $asset) { throw "Could not find mpv-dev-lgpl-x86_64 asset in zhongfly/mpv-winbuild latest release." }
          Write-Host "Downloading LGPL media engine: $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "build-deps\mpv-lgpl.7z"
          7z e "build-deps\mpv-lgpl.7z" -o"build-deps" "libmpv-2.dll" -r -y

      - name: Assemble clean portable release ZIP & SHA256SUMS.txt
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\package-portable-release.ps1 `
            -Version "${{ steps.meta.outputs.version }}" `
            -ExePath "target\x86_64-pc-windows-msvc\release\StreamVault.exe" `
            -MpvDllPath "build-deps\libmpv-2.dll" `
            -VulkanStubPath "build-deps\vulkan-1.dll"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamVault-v${{ steps.meta.outputs.version }}-win64-portable
          path: |
            dist/StreamVault-v${{ steps.meta.outputs.version }}-win64-portable.zip
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/StreamVault-v${{ steps.meta.outputs.version }}-win64-portable.zip
            dist/SHA256SUMS.txt
